name: Daily LINE sync
on:
  schedule:
    - cron: "0 23,5,11 * * *"   # 06:00, 12:00, 18:00 เวลาไทย
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ทดสอบ (ไม่ส่งเข้า LINE จริง)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser deep-translator
      - name: ดึงข่าว + แปลไทย
        run: |
          python fetch_news.py
          python translate_news.py
      - name: ส่งข่าวเข้า LINE OA
        run: python push_line.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Commit news.json และรายการที่ส่งแล้ว
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add news.json
          [ -f sent_news.json ] && git add sent_news.json || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: daily news sync"
            git pull --rebase
            git push
          fi
