name: Daily News Fetcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch Latest News
        run: python fetch_news.py

      - name: Commit and Push updated news.json
        run: |
          git config --global user.name "WWN-Bot"
          git config --global user.email "bot@wwn.news"
          git add news.json
          git commit -m "Auto-update daily news [$(date +'%Y-%m-%d')]" || exit 0
          git push
