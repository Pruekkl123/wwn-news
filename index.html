<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N - The Local Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Prompt', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .glass-btn:hover, .glass-btn.active {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.5);
            color: #22d3ee;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- ส่วนหัวเว็บไซต์สไตล์ The Local -->
    <header class="max-w-4xl mx-auto mb-8 text-center">
        <h1 class="text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
            W.W.N // INTERNATIONAL
        </h1>
        <p class="text-sm text-gray-400 mt-2">Global News Network inspired by The Local</p>

        <!-- แผงเลือกประเทศสไตล์ The Local & ปุ่มแปลภาษาทั้งหน้า -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mt-6 p-4 glass-card rounded-2xl">
            
            <!-- ปุ่มเลือกประเทศข่าว (The Local Style) -->
            <div id="country-filters" class="flex flex-wrap gap-2 justify-center">
                <button onclick="filterCountry('all')" class="glass-btn active px-4 py-2 rounded-xl text-xs font-semibold" data-country="all">All Countries</button>
                <button onclick="filterCountry('Sweden')" class="glass-btn px-4 py-2 rounded-xl text-xs font-semibold" data-country="Sweden">Sweden</button>
                <button onclick="filterCountry('Germany')" class="glass-btn px-4 py-2 rounded-xl text-xs font-semibold" data-country="Germany">Germany</button>
                <button onclick="filterCountry('France')" class="glass-btn px-4 py-2 rounded-xl text-xs font-semibold" data-country="France">France</button>
                <button onclick="filterCountry('Thailand')" class="glass-btn px-4 py-2 rounded-xl text-xs font-semibold" data-country="Thailand">Thailand</button>
            </div>

            <!-- ปุ่มแปลภาษาทั้งหน้า (Google Translate Widget ซ่อนรูปแบบเดิมแล้วทำปุ่มคลิกเท่ๆ) -->
            <div class="flex items-center gap-2">
                <div id="google_translate_element" style="display:none;"></div>
                <button onclick="triggerTranslate('th')" class="glass-btn px-3 py-2 rounded-xl text-xs font-bold text-cyan-300 border-cyan-500/30">🇹🇭 แปลทั้งหน้าเป็นไทย</button>
                <button onclick="triggerTranslate('en')" class="glass-btn px-3 py-2 rounded-xl text-xs font-bold text-gray-300">🇬🇧 English</button>
            </div>
        </div>
    </header>

    <!-- พื้นที่แสดงข่าว -->
    <main id="news-container" class="max-w-4xl mx-auto space-y-6">
        <!-- ข่าวจะแสดงตรงนี้ -->
    </main>

    <!-- สคริปต์ Google Translate แบบซ่อนตัวเดิมแล้วสั่งงานผ่านปุ่ม -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'th,en,sv,de,fr',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function triggerTranslate(lang) {
            var selectField = document.querySelector(".goog-te-combo");
            if (selectField) {
                selectField.value = lang;
                selectField.dispatchEvent(new Event("change"));
            } else {
                alert("ระบบแปลกำลังโหลด กรุณารอสักครู่แล้วลองใหม่อีกครั้งครับ");
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .goog-logo-link { display: none !important; }
        .goog-te-gadget { color: transparent !important; }
    </style>

    <script>
        let allNewsData = [];
        let currentCountry = 'all';

        async function loadNews() {
            try {
                const response = await fetch('news.json');
                allNewsData = await response.json();
                renderNews();
            } catch (error) {
                console.error("โหลดข่าวไม่สำเร็จ:", error);
            }
        }

        function renderNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            const filtered = currentCountry === 'all' 
                ? allNewsData 
                : allNewsData.filter(item => item.cat && item.cat.toLowerCase() === currentCountry.toLowerCase());

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">No news found for this country.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card p-6 rounded-2xl shadow-xl transition-all duration-300 hover:border-cyan-500/50';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="px-3 py-1 text-xs font-semibold bg-cyan-500/20 text-cyan-300 rounded-full border border-cyan-500/30">${item.cat || 'General'}</span>
                        <span class="text-xs text-gray-400">${item.date}</span>
                    </div>
                    <h2 class="text-xl font-bold mb-2 text-white">${item.title}</h2>
                    <p class="text-gray-300 text-sm leading-relaxed mb-4">${item.desc}</p>
                    ${item.img ? `<img src="${item.img}" alt="News Image" class="w-full h-48 object-cover rounded-xl mt-2 border border-white/10">` : ''}
                `;
                container.appendChild(card);
            });
        }

        function filterCountry(country) {
            currentCountry = country;
            document.querySelectorAll('#country-filters button').forEach(btn => {
                if (btn.getAttribute('data-country') === country) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderNews();
        }

        loadNews();
    </script>
</body>
</html>
