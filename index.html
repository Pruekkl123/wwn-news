<!-- Google Translate Auto-Translate Script -->
<div id="google_translate_element" style="display:none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en', 
      includedLanguages: 'th,en', // กำหนดให้เลือกแปลไทย หรืออังกฤษได้
      autoDisplay: false
    }, 'google_translate_element');
    
    // สั่งให้เว็บแปลงเป็นภาษาไทยให้อัตโนมัติทันทีที่โหลดเสร็จ
    setTimeout(function() {
      var selectField = document.querySelector(".goog-te-combo");
      if (selectField) {
        selectField.value = "th";
        selectField.dispatchEvent(new Event("change"));
      }
    }, 1000);
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
  /* ซ่อนแถบแจ้งเตือนด้านบนของ Google ให้หน้าเว็บ Liquid Glass ของเราสวยเนียนไร้รอยต่อ */
  .goog-te-banner-frame.skiptranslate { display: none !important; }
  body { top: 0px !important; }
  .goog-logo-link { display: none !important; }
  .goog-te-gadget { color: transparent !important; }
</style>
