<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N // Worldwide News</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            red: '#FF0055',
                            cyan: '#00F0FF',
                            neon: '#39FF14',
                            darkBg: '#030712',
                            cardBg: 'rgba(13, 20, 38, 0.7)',
                            border: 'rgba(0, 240, 255, 0.2)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 85, 0.08) 0%, transparent 50%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            background-attachment: fixed;
        }

        .holo-card {
            background: rgba(13, 20, 38, 0.75);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .holo-card:hover {
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.15);
            transform: translateY(-4px);
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanner-beam::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.8), transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        .ticker-wrap { overflow: hidden; white-space: nowrap; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 28s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-cyber-cyan selection:text-slate-950">

    <!-- TOP TELEMETRY BAR -->
    <div class="bg-slate-950/90 border-b border-cyber-border text-xs py-1.5 px-4 font-mono text-cyan-400">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></span> NETWORK_FEED: ONLINE</span>
                <span class="hidden md:inline text-slate-500">|</span>
                <span id="system-time" class="hidden md:inline text-slate-300">BANGKOK TIME (ICT): LOADING...</span>
            </div>
            <div class="flex items-center space-x-6 text-[11px]">
                <span class="text-slate-400">STATUS: <strong class="text-cyber-cyan">LIVE GLOBAL DISPATCH</strong></span>
                <button id="btn-open-saved" class="hover:text-cyber-cyan transition cursor-pointer">SAVED_REPORTS (<span id="saved-count">0</span>)</button>
            </div>
        </div>
    </div>

    <!-- MAIN HEADER -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-cyber-border">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="#" id="brand-logo" class="flex items-center gap-3 group">
                <div class="bg-gradient-to-br from-cyber-cyan to-blue-600 text-slate-950 font-black text-xl tracking-tighter px-3.5 py-1.5 rounded-lg shadow-[0_0_20px_rgba(0,240,255,0.4)] group-hover:scale-105 transition font-mono">
                    W.W.N
                </div>
                <div class="flex flex-col font-mono">
                    <span class="font-black text-lg leading-none tracking-widest text-white neon-glow">WORLDWIDE</span>
                    <span class="font-black text-lg leading-none tracking-[0.18em] uppercase text-cyber-cyan mt-1 neon-glow">NEWS</span>
                </div>
            </a>

            <nav class="hidden lg:flex items-center space-x-1 font-mono text-xs uppercase tracking-widest">
                <button data-cat="all" class="nav-cat-btn active px-3 py-1.5 rounded text-cyber-cyan bg-cyan-950/50 border border-cyber-cyan/30 transition cursor-pointer">All Reports</button>
                <button data-cat="Sweden" class="nav-cat-btn px-3 py-1.5 rounded text-slate-400 hover:text-cyber-cyan transition cursor-pointer">Sweden</button>
                <button data-cat="Denmark" class="nav-cat-btn px-3 py-1.5 rounded text-slate-400 hover:text-cyber-cyan transition cursor-pointer">Denmark</button>
                <button data-cat="Germany" class="nav-cat-btn px-3 py-1.5 rounded text-slate-400 hover:text-cyber-cyan transition cursor-pointer">Germany</button>
                <button data-cat="Europe" class="nav-cat-btn px-3 py-1.5 rounded text-slate-400 hover:text-cyber-cyan transition cursor-pointer">Wider Europe</button>
