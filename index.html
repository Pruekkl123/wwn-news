<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N // Worldwide News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at 50% -20%, #0c1b33 0%, #020617 70%);
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: #f8fafc;
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 10x Liquid Glass (Extreme Glassmorphism & High Performance) */
        .liquid-glass-extreme {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.6) 100%);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .liquid-glass-extreme:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0.75) 100%);
            border-color: rgba(56, 189, 248, 0.6);
            border-top-color: rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.7), 
                0 0 35px rgba(56, 189, 248, 0.25), 
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 0 rgba(56, 189, 248, 0.3);
            transform: translateY(-5px);
        }

        .liquid-header {
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(50px) saturate(250%);
            -webkit-backdrop-filter: blur(50px) saturate(250%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <canvas id="starfield"></canvas>

    <!-- HEADER / NAVIGATION -->
    <header class="liquid-header sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-cyan-400 to-sky-300 text-slate-950 font-black px-3.5 py-1.5 rounded-2xl font-mono text-lg shadow-[0_0_30px_rgba(56,189,248,0.6)] border border-white/40">W.W.N</div>
                <span class="font-mono font-bold tracking-widest text-slate-100 text-sm drop-shadow">WORLDWIDE NEWS</span>
            </div>
            
            <div class="flex flex-wrap gap-2 font-mono text-xs">
                <button onclick="filterNews('all')" class="cat-btn px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 font-bold shadow-[0_0_20px_rgba(34,211,238,0.5)] transition cursor-pointer">ALL</button>
                <button onclick="filterNews('Sweden')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-extreme text-slate-200 hover:text-white transition cursor-pointer">SWEDEN</button>
                <button onclick="filterNews('Denmark')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-extreme text-slate-200 hover:text-white transition cursor-pointer">DENMARK</button>
                <button onclick="filterNews('Germany')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-extreme text-slate-200 hover:text-white transition cursor-pointer">GERMANY</button>
                <button onclick="filterNews('Europe')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-extreme text-slate-200 hover:text-white transition cursor-pointer">EUROPE</button>
            </div>
        </div>
    </header>

    <!-- ARCHIVE BAR -->
    <div class="liquid-glass-extreme border-x-0 border-t-0 rounded-none py-2.5 px-6 relative z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between font-mono text-xs">
            <span class="text-sky-300 font-semibold flex items-center"><i class="fas fa-satellite-dish mr-2 text-cyan-400 animate-pulse"></i> LIVE NEWS DISPATCHES:</span>
            <span class="px-3 py-1 rounded-lg bg-sky-500/20 text-sky-200 border border-sky-400/30">TODAY (OCT 17, 2026)</span>
        </div>
    </div>

    <!-- MAIN CONTENT GRID -->
    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full relative z-10">
        <h2 id="heading" class="font-mono text-sky-300 font-bold text-sm tracking-wider mb-6 drop-shadow">WORLDWIDE NEWS // ALL REPORTS</h2>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- ARTICLE READING MODAL -->
    <div id="article-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/80 backdrop-blur-2xl flex justify-center items-center p-4">
        <div class="relative liquid-glass-extreme w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="sticky top-0 z-10 liquid-header p-5 flex items-center justify-between font-mono text-xs border-b border-white/10">
                <span id="modal-category" class="text-cyan-300 font-bold uppercase tracking-widest">CATEGORY</span>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-slate-200 flex items-center justify-center transition cursor-pointer"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 sm:p-8 overflow-y-auto space-y-5">
                <h1 id="modal-title" class="text-xl sm:text-2xl font-black text-white leading-snug"></h1>
                <div class="font-mono text-xs text-slate-400" id="modal-date"></div>
                <div class="rounded-2xl overflow-hidden h-72 bg-slate-900/50 border border-white/15 shadow-inner">
                    <img id="modal-image" src="" alt="News Image" class="w-full h-full object-cover">
                </div>
                <div id="modal-body" class="text-slate-200 text-sm leading-relaxed space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- SCRIPT (Optimized Performance) -->
    <script>
        var newsData = [];
        var currentFilter = 'all';

        function initStarfield() {
            var canvas = document.getElementById('starfield');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var width = canvas.width = window.innerWidth;
            var height = canvas.height = window.innerHeight;
            var stars = [];
            var colors = ['#38bdf8', '#ffffff', '#7dd3fc', '#0284c7'];

            for (var i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.8 + 0.4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 0.1,
                    vy: (Math.random() - 0.5) * 0.1,
                    alpha: Math.random() * 0.6 + 0.3,
                    speed: Math.random() * 0.008 + 0.002,
                    decreasing: Math.random() > 0.5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.x += s.vx; s.y += s.vy;
                    if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
                    if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
                    if (s.decreasing) {
                        s.alpha -= s.speed; if (s.alpha <= 0.2) s.decreasing = false;
                    } else {
                        s.alpha += s.speed; if (s.alpha >= 0.9) s.decreasing = true;
                    }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = s.alpha;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = s.color;
                    ctx.fill();
                }
                requestAnimationFrame(animate);
            }
            window.onresize = function() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
            animate();
        }

        function loadNews() {
            fetch('news.json')
                .then(response => response.json())
                .then(data => {
                    newsData = data;
                    renderNews(currentFilter);
                })
                .catch(err => {
                    console.log('Error loading news.json:', err);
                });
        }

        function renderNews(filter) {
            currentFilter = filter || 'all';
            var grid = document.getElementById('grid');
            var heading = document.getElementById('heading');
            if (!grid || !heading) return;
            grid.innerHTML = '';
            
            var count = 0;
            for (var i = 0; i < newsData.length; i++) {
                var item = newsData[i];
                if (currentFilter === 'all' || item.cat.toLowerCase() === currentFilter.toLowerCase()) {
                    count++;
                    var card = document.createElement('div');
                    card.className = "liquid-glass-extreme rounded-3xl p-5 flex flex-col justify-between cursor-pointer group";
                    card.onclick = (function(newsItem) { return function() { openModal(newsItem); }; })(item);
                    card.innerHTML = 
                        '<div>' +
                            '<div class="relative h-48 rounded-2xl overflow-hidden bg-slate-900/50 mb-4 border border-white/10 shadow-inner">' +
                                '<img src="' + item.img + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 ease-out">' +
                                '<span class="absolute top-3 left-3 bg-slate-950/70 backdrop-blur-xl text-cyan-300 font-mono text-[10px] px-3 py-1 rounded-xl border border-white/20 shadow-lg">' + item.cat + '</span>' +
                            '</div>' +
                            '<div class="font-mono text-xs text-slate-400 mb-2">' + item.date + ' • 3m read</div>' +
                            '<h3 class="font-bold text-sm text-white line-clamp-2 mb-2.5 group-hover:text-cyan-300 transition">' + item.title + '</h3>' +
                            '<p class="text-xs text-slate-300 line-clamp-3 leading-relaxed">' + item.desc + '</p>' +
                        '</div>' +
                        '<div class="mt-5 pt-3.5 border-t border-white/10 flex justify-between items-center font-mono text-xs">' +
                            '<span class="text-slate-400 font-medium">W.W.N</span>' +
                            '<span class="text-cyan-300 font-bold flex items-center gap-1 group-hover:translate-x-1 transition">READ <i class="fas fa-chevron-right text-[9px]"></i></span>' +
                        '</div>';
                    grid.appendChild(card);
                }
            }
            heading.innerText = 'WORLDWIDE NEWS // ' + currentFilter.toUpperCase() + ' REPORTS (' + count + ')';
        }

        function openModal(item) {
            document.getElementById('modal-category').innerText = item.cat;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-date').innerText = item.date + ' • 3m read';
            document.getElementById('modal-image').src = item.img;
            document.getElementById('modal-body').innerHTML = '<p>' + item.desc + '</p>';
            document.getElementById('article-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
        }

        function filterNews(cat) {
            var btns = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].className = "cat-btn px-4 py-2 rounded-xl liquid-glass-extreme text-slate-200 hover:text-white transition cursor-pointer";
            }
            if (window.event && window.event.target) {
                window.event.target.className = "cat-btn px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 font-bold shadow-[0_0_20px_rgba(34,211,238,0.5)] transition cursor-pointer";
            }
            renderNews(cat);
        }

        window.onload = function() {
            initStarfield();
            loadNews();
        };
    </script>
</body>
</html>
