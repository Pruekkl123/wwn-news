<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N // Worldwide News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        #starfield { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        .holo-card {
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
        }
        .holo-card:hover {
            border-color: rgba(0, 240, 255, 0.8);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            transform: translateY(-3px);
        }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col relative">

    <canvas id="starfield"></canvas>

    <header class="bg-slate-950/90 backdrop-blur-md border-b border-cyan-500/40 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-400 text-slate-950 font-black px-3 py-1.5 rounded font-mono text-lg shadow-[0_0_20px_rgba(0,240,255,0.7)]">W.W.N</div>
                <span class="font-mono font-bold tracking-widest text-white">WORLDWIDE NEWS</span>
            </div>
            <div class="flex gap-2 font-mono text-xs">
                <button onclick="filterNews('all')" class="cat-btn px-3 py-1.5 rounded bg-cyan-400 text-slate-950 font-bold cursor-pointer">ALL</button>
                <button onclick="filterNews('Sweden')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">SWEDEN</button>
                <button onclick="filterNews('Denmark')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">DENMARK</button>
                <button onclick="filterNews('Germany')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">GERMANY</button>
                <button onclick="filterNews('Europe')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">EUROPE</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full relative z-10">
        <h2 id="heading" class="font-mono text-cyan-400 font-bold mb-6 drop-shadow-[0_0_10px_rgba(0,240,255,0.5)]">WORLDWIDE NEWS // LOADING LIVE DISPATCHES...</h2>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="article-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/85 backdrop-blur-md flex justify-center items-center p-4">
        <div class="relative holo-card w-full max-w-2xl rounded-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="sticky top-0 z-10 bg-slate-950/95 border-b border-cyan-500/40 p-4 flex items-center justify-between font-mono text-xs">
                <span id="modal-category" class="text-cyan-400 font-bold uppercase tracking-widest">CATEGORY</span>
                <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white cursor-pointer"><i class="fas fa-times text-base"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <h1 id="modal-title" class="text-xl sm:text-2xl font-black text-white"></h1>
                <div class="font-mono text-xs text-slate-400" id="modal-date"></div>
                <div class="rounded-xl overflow-hidden h-64 bg-slate-900 border border-cyan-500/30">
                    <img id="modal-image" src="" alt="News Image" class="w-full h-full object-cover">
                </div>
                <div id="modal-body" class="text-slate-300 text-sm leading-relaxed space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        var newsData = [];
        var currentFilter = 'all';

        function initStarfield() {
            var canvas = document.getElementById('starfield');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var width = canvas.width = window.innerWidth;
            var height = canvas.height = window.innerHeight;
            var stars = [];
            var shootingStars = [];
            var colors = ['#00F0FF', '#FFFFFF', '#38BDF8', '#A5F3FC'];

            for (var i = 0; i < 500; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 0.6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    alpha: Math.random() * 0.6 + 0.4,
                    speed: Math.random() * 0.015 + 0.005,
                    decreasing: Math.random() > 0.5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.x += s.vx; s.y += s.vy;
                    if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
                    if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
                    if (s.decreasing) {
                        s.alpha -= s.speed; if (s.alpha <= 0.3) s.decreasing = false;
                    } else {
                        s.alpha += s.speed; if (s.alpha >= 1) s.decreasing = true;
                    }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = s.alpha;
                    ctx.shadowBlur = (s.radius > 1.8) ? 12 : 4;
                    ctx.shadowColor = s.color;
                    ctx.fill();
                }
                if (Math.random() < 0.04 && shootingStars.length < 4) {
                    shootingStars.push({ x: Math.random() * width, y: Math.random() * (height / 2), length: Math.random() * 100 + 60, speed: Math.random() * 12 + 8, alpha: 1 });
                }
                for (var j = shootingStars.length - 1; j >= 0; j--) {
                    var ss = shootingStars[j];
                    var endX = ss.x - ss.length * 0.707;
                    var endY = ss.y + ss.length * 0.707;
                    var grad = ctx.createLinearGradient(ss.x, ss.y, endX, endY);
                    grad.addColorStop(0, 'rgba(0, 240, 255, ' + ss.alpha + ')');
                    grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
                    ctx.globalAlpha = 1;
                    ctx.beginPath();
                    ctx.moveTo(ss.x, ss.y); ctx.lineTo(endX, endY);
                    ctx.strokeStyle = grad; ctx.lineWidth = 2.5; ctx.shadowBlur = 10; ctx.shadowColor = '#00F0FF'; ctx.stroke();
                    ss.x += ss.speed * 0.707; ss.y += ss.speed * 0.707; ss.alpha -= 0.02;
                    if (ss.alpha <= 0) shootingStars.splice(j, 1);
                }
                requestAnimationFrame(animate);
            }
            window.onresize = function() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
            animate();
        }

        function loadNews() {
            fetch('news.json')
                .then(response => response.json())
                .then(data => {
                    newsData = data;
                    renderNews(currentFilter);
                })
                .catch(err => {
                    console.log('Using fallback local data:', err);
                });
        }

        function renderNews(filter) {
            currentFilter = filter || 'all';
            var grid = document.getElementById('grid');
            var heading = document.getElementById('heading');
            if (!grid || !heading) return;
            grid.innerHTML = '';
            
            var count = 0;
            for (var i = 0; i < newsData.length; i++) {
                var item = newsData[i];
                if (currentFilter === 'all' || item.cat.toLowerCase() === currentFilter.toLowerCase()) {
                    count++;
                    var card = document.createElement('div');
                    card.className = "holo-card rounded-xl p-4 flex flex-col justify-between cursor-pointer group";
                    card.onclick = (function(newsItem) { return function() { openModal(newsItem); }; })(item);
                    card.innerHTML = 
                        '<div>' +
                            '<div class="relative h-44 rounded-lg overflow-hidden bg-slate-900 mb-3">' +
                                '<img src="' + item.img + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">' +
                                '<span class="absolute top-2 left-2 bg-slate-950/80 text-cyan-400 font-mono text-[10px] px-2 py-0.5 rounded border border-cyan-500/30">' + item.cat + '</span>' +
                            '</div>' +
                            '<div class="font-mono text-xs text-slate-400 mb-1">' + item.date + ' • 3m read</div>' +
                            '<h3 class="font-bold text-sm text-white line-clamp-2 mb-2 group-hover:text-cyan-400 transition">' + item.title + '</h3>' +
                            '<p class="text-xs text-slate-400 line-clamp-3">' + item.desc + '</p>' +
                        '</div>' +
                        '<div class="mt-4 pt-3 border-t border-cyan-500/20 flex justify-between items-center font-mono text-xs">' +
                            '<span class="text-slate-500">W.W.N</span>' +
                            '<span class="text-cyan-400 font-bold flex items-center gap-1">READ <i class="fas fa-chevron-right text-[9px]"></i></span>' +
                        '</div>';
                    grid.appendChild(card);
                }
            }
            heading.innerText = 'WORLDWIDE NEWS // ' + currentFilter.toUpperCase() + ' REPORTS (' + count + ')';
        }

        function openModal(item) {
            document.getElementById('modal-category').innerText = item.cat;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-date').innerText = item.date + ' • 3m read';
            document.getElementById('modal-image').src = item.img;
            document.getElementById('modal-body').innerHTML = '<p>' + item.desc + '</p>';
            document.getElementById('article-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
        }

        function filterNews(cat) {
            var btns = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].className = "cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer";
            }
            if (window.event && window.event.target) {
                window.event.target.className = "cat-btn px-3 py-1.5 rounded bg-cyan-400 text-slate-950 font-bold cursor-pointer";
            }
            renderNews(cat);
        }

        window.onload = function() {
            initStarfield();
            loadNews();
        };
    </script>
</body>
</html>
