<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ข่าวแปลไทย</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#1f2430;--mut:#6b7280;--bd:#eee2d0;--p1:#ff5e8a;--p2:#ffb02e;--p3:#4f8cff;--line:#06c755}
@media(prefers-color-scheme:dark){:root{--bg:#14161d;--card:#1e222c;--tx:#f2f3f7;--mut:#9aa1b2;--bd:#2d3240;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt',system-ui,sans-serif;line-height:1.6}
#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,var(--p1),var(--p2) 50%,var(--p3));display:grid;place-items:center;transition:opacity .6s,visibility .6s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);animation:fl 4s ease-in-out infinite}
.blob:nth-child(1){width:220px;height:220px;left:-40px;top:10%}
.blob:nth-child(2){width:160px;height:160px;right:-20px;top:55%;animation-delay:-1s}
.blob:nth-child(3){width:100px;height:100px;left:55%;top:8%;animation-delay:-2s}
@keyframes fl{50%{transform:translateY(-28px) scale(1.08)}}
.sp{position:relative;text-align:center;color:#fff}
.sp h1{margin:8px 0 4px;font-size:2rem;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.logo{font-size:4rem;animation:spin 1.6s ease-in-out}
@keyframes spin{from{transform:rotate(-360deg) scale(0)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.dots{display:flex;gap:10px;justify-content:center;margin-top:22px}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;animation:b .9s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-16px)}}
header{max-width:760px;margin:auto;padding:28px 20px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h2{margin:0;font-size:1.6rem;background:linear-gradient(90deg,var(--p1),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:999px;padding:9px 16px;font-weight:600;color:#fff;background:var(--line);text-decoration:none;display:none}
main{max-width:760px;margin:auto;padding:0 20px 60px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--p3);border-color:var(--p3);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:14px 0;opacity:0;transform:translateY(30px);animation:rise .6s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.card h3{margin:0 0 6px}.meta{color:var(--mut);font-size:.8rem}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:10px;background:var(--bd)}
.tag{background:var(--p3);color:#fff;border-radius:6px;padding:1px 8px;font-size:.75rem}
details{color:var(--mut);font-size:.9rem;margin-top:8px}
.more{display:inline-block;margin-top:8px;color:var(--p3);text-decoration:none;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="splash"><div class="blob"></div><div class="blob"></div><div class="blob"></div>
<div class="sp"><div class="logo">📰</div><h1>ข่าวสดใหม่</h1><div class="dots"><i></i><i></i><i></i></div></div></div>
<header><h2>📰 ข่าวแปลไทย</h2><a id="oa" class="btn" target="_blank" rel="noopener">＋ เพิ่มเพื่อน LINE OA</a></header>
<main><div id="chips" class="chips"></div><div id="list"><div class="empty">กำลังโหลด…</div></div></main>
<script>
var OA_ID = "985diaue"; // ใส่ LINE OA ID ของคุณ เช่น "@yourshop" (เว้นว่างไว้ = ไม่แสดงปุ่ม)
var items = [], cat = "ทั้งหมด";
if (OA_ID) { var a = document.getElementById("oa"); a.href = "https://line.me/R/ti/p/" + encodeURIComponent(OA_ID); a.style.display = "inline-block"; }
setTimeout(function () { document.getElementById("splash").classList.add("out"); }, 2200);
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

function render() {
  var cats = ["ทั้งหมด"];
  items.forEach(function (n) { if (n.cat && cats.indexOf(n.cat) < 0) cats.push(n.cat); });
  document.getElementById("chips").innerHTML = cats.map(function (c) {
    return '<button class="chip' + (c === cat ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + "</button>";
  }).join("");
  var shown = cat === "ทั้งหมด" ? items : items.filter(function (n) { return n.cat === cat; });
  var L = document.getElementById("list");
  if (!shown.length) { L.innerHTML = '<div class="empty">ยังไม่มีข่าว</div>'; return; }
  L.innerHTML = shown.map(function (n, i) {
    var link = n.url || n.link;
    return '<article class="card" style="animation-delay:' + (2.3 + Math.min(i, 8) * 0.12) + 's">' +
      (n.img ? '<img class="thumb" loading="lazy" src="' + esc(n.img) + '" alt="">' : "") +
      '<div class="meta"><span class="tag">' + esc(n.cat) + "</span> " + esc(n.date) + "</div>" +
      "<h3>" + esc(n.titleTh || n.title) + "</h3><div>" + esc(n.descTh || n.desc) + "</div>" +
      "<details><summary>ต้นฉบับภาษาอังกฤษ</summary><b>" + esc(n.title) + "</b><br>" + esc(n.desc) + "</details>" +
      (link ? '<a class="more" target="_blank" rel="noopener" href="' + esc(link) + '">อ่านต้นฉบับ →</a>' : "") +
      "</article>";
  }).join("");
}
document.getElementById("chips").addEventListener("click", function (e) {
  var c = e.target.getAttribute("data-c"); if (c) { cat = c; render(); }
});
function load() {
  fetch("news.json?t=" + Date.now()).then(function (r) { return r.json(); })
    .then(function (d) { items = d; render(); })
    .catch(function () { document.getElementById("list").innerHTML = '<div class="empty">โหลดข่าวไม่สำเร็จ</div>'; });
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
