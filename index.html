<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N // Worldwide News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Animated Canvas Background */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .holo-card {
            background: rgba(13, 20, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }
        .holo-card:hover {
            border-color: rgba(0, 240, 255, 0.7);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            transform: translateY(-3px);
        }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col relative">

    <!-- ANIMATED DENSE STARFIELD WALLPAPER -->
    <canvas id="starfield"></canvas>

    <!-- HEADER -->
    <header class="bg-slate-950/90 backdrop-blur-md border-b border-cyan-500/30 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-400 text-slate-950 font-black px-3 py-1.5 rounded font-mono text-lg shadow-[0_0_15px_rgba(0,240,255,0.5)]">W.W.N</div>
                <span class="font-mono font-bold tracking-widest text-white">WORLDWIDE NEWS</span>
            </div>
            <div class="flex gap-2 font-mono text-xs">
                <button onclick="filterNews('all')" class="cat-btn px-3 py-1.5 rounded bg-cyan-400 text-slate-950 font-bold cursor-pointer">ALL</button>
                <button onclick="filterNews('Sweden')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">SWEDEN</button>
                <button onclick="filterNews('Denmark')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">DENMARK</button>
                <button onclick="filterNews('Germany')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">GERMANY</button>
                <button onclick="filterNews('Europe')" class="cat-btn px-3 py-1.5 rounded bg-slate-900/90 text-slate-300 border border-cyan-500/30 cursor-pointer">EUROPE</button>
            </div>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full relative z-10">
        <h2 id="heading" class="font-mono text-cyan-400 font-bold mb-6">WORLDWIDE NEWS // ALL REPORTS (40)</h2>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- ARTICLE READING MODAL -->
    <div id="article-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/80 backdrop-blur-md flex justify-center items-center p-4">
        <div class="relative holo-card w-full max-w-2xl rounded-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="sticky top-0 z-10 bg-slate-950/95 border-b border-cyan-500/30 p-4 flex items-center justify-between font-mono text-xs">
                <span id="modal-category" class="text-cyan-400 font-bold uppercase tracking-widest">CATEGORY</span>
                <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white cursor-pointer"><i class="fas fa-times text-base"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <h1 id="modal-title" class="text-xl sm:text-2xl font-black text-white"></h1>
                <div class="font-mono text-xs text-slate-400" id="modal-date"></div>
                <div class="rounded-xl overflow-hidden h-64 bg-slate-900 border border-cyan-500/20">
                    <img id="modal-image" src="" alt="News Image" class="w-full h-full object-cover">
                </div>
                <div id="modal-body" class="text-slate-300 text-sm leading-relaxed space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        /* ANIMATED DENSE STARFIELD WALLPAPER WITH SHOOTING STARS */
        function initStarfield() {
            var canvas = document.getElementById('starfield');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            
            var width = canvas.width = window.innerWidth;
            var height = canvas.height = window.innerHeight;
            
            var stars = [];
            var numStars = 450; // Increased density
            var shootingStars = [];

            // Colors for realistic galaxy stars
            var starColors = ['rgba(0, 240, 255, ', 'rgba(255, 255, 255, ', 'rgba(150, 220, 255, ', 'rgba(200, 240, 255, '];
            
            for (var i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.8 + 0.2,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15,
                    color: starColors[Math.floor(Math.random() * starColors.length)],
                    alpha: Math.random(),
                    speed: Math.random() * 0.008 + 0.002,
                    decreasing: Math.random() > 0.5
                });
            }

            function createShootingStar() {
                if (Math.random() < 0.03 && shootingStars.length < 3) {
                    shootingStars.push({
                        x: Math.random() * width,
                        y: Math.random() * (height / 2),
                        length: Math.random() * 80 + 40,
                        speed: Math.random() * 10 + 6,
                        angle: Math.PI / 4, // 45 degree angle
                        alpha: 1
                    });
                }
            }
            
            function animate() {
                ctx.clearRect(0, 0, width, height);
                
                // Render Stars
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    
                    s.x += s.vx;
                    s.y += s.vy;
                    
                    if (s.x < 0) s.x = width;
                    if (s.x > width) s.x = 0;
                    if (s.y < 0) s.y = height;
                    if (s.y > height) s.y = 0;
                    
                    if (s.decreasing) {
                        s.alpha -= s.speed;
                        if (s.alpha <= 0.1) s.decreasing = false;
                    } else {
                        s.alpha += s.speed;
                        if (s.alpha >= 1) s.decreasing = true;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color + s.alpha + ')';
                    if (s.radius > 1.2) {
                        ctx.shadowBlur = 6;
                        ctx.shadowColor = '#00F0FF';
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                }

                // Render Shooting Stars
                createShootingStar();
                for (var j = shootingStars.length - 1; j >= 0; j--) {
                    var ss = shootingStars[j];
                    var endX = ss.x - ss.length * Math.cos(ss.angle);
                    var endY = ss.y + ss.length * Math.sin(ss.angle);

                    var gradient = ctx.createLinearGradient(ss.x, ss.y, endX, endY);
                    gradient.addColorStop(0, 'rgba(0, 240, 255, ' + ss.alpha + ')');
                    gradient.addColorStop(1, 'rgba(0, 240, 255, 0)');

                    ctx.beginPath();
                    ctx.moveTo(ss.x, ss.y);
                    ctx.lineTo(endX, endY);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ss.x += ss.speed * Math.cos(ss.angle);
                    ss.y += ss.speed * Math.sin(ss.angle);
                    ss.alpha -= 0.015;

                    if (ss.alpha <= 0 || ss.x > width || ss.y > height) {
                        shootingStars.splice(j, 1);
                    }
                }
                
                requestAnimationFrame(animate);
            }
            
            window.onresize = function() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window
