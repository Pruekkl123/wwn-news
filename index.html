<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N - International News Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            color: #f3f4f6;
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        /* แบ็กกราวด์แสงออโรร่าเคลื่อนไหวสมูทๆ */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -50;
            pointer-events: none;
            background: linear-gradient(125deg, #020617, #064e3b, #0f172a, #1e3a8a, #020617);
            background-size: 400% 400%;
            animation: auroraFlow 15s ease infinite;
        }

        @keyframes auroraFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-modal {
            background: rgba(11, 15, 25, 0.90);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .glass-btn:hover, .glass-btn.active {
            background: rgba(6, 182, 212, 0.25);
            border-color: rgba(6, 182, 212, 0.6);
            color: #22d3ee;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 relative">

    <!-- แบ็กกราวด์แสงออโรร่าขยับได้ -->
    <div class="aurora-bg"></div>

    <!-- ส่วนหัวเว็บไซต์สไตล์ The Local -->
    <header class="max-w-6xl mx-auto mb-8 text-center relative z-10">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-500 drop-shadow-lg">
            W.W.N // INTERNATIONAL
        </h1>
        <p class="text-sm text-gray-300 mt-2 tracking-wide">Global News Network inspired by The Local</p>

        <!-- แผงเลือกประเทศ & ปุ่มแปลภาษา -->
        <div class="flex flex-col gap-4 mt-6 p-4 glass-card rounded-2xl shadow-2xl">
            <div id="country-filters" class="flex flex-wrap gap-2 justify-center items-center">
                <button onclick="filterCountry('all')" class="glass-btn active px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="all">ALL</button>
                <button onclick="filterCountry('Germany')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Germany">GERMANY</button>
                <button onclick="filterCountry('France')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="France">FRANCE</button>
                <button onclick="filterCountry('Sweden')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Sweden">SWEDEN</button>
                <button onclick="filterCountry('Italy')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Italy">ITALY</button>
                <button onclick="filterCountry('Spain')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Spain">SPAIN</button>
                <button onclick="filterCountry('Denmark')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Denmark">DENMARK</button>
                <button onclick="filterCountry('Switzerland')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Switzerland">SWITZERLAND</button>
                <button onclick="filterCountry('Austria')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Austria">AUSTRIA</button>
                <button onclick="filterCountry('Norway')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold" data-country="Norway">NORWAY</button>
            </div>

            <div class="flex justify-center items-center gap-2 pt-2 border-t border-white/10">
                <div id="google_translate_element" style="display:none;"></div>
                <button onclick="triggerTranslate('th')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-bold text-cyan-300 border-cyan-500/30">🇹🇭 แปลทั้งหน้าเป็นไทย</button>
                <button onclick="triggerTranslate('en')" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-bold text-gray-300">🇬🇧 English</button>
            </div>
        </div>
    </header>

    <!-- พื้นที่แสดงข่าว -->
    <main id="news-container" class="max-w-4xl mx-auto space-y-6 relative z-10">
        <!-- ข่าวจะแสดงตรงนี้ -->
    </main>

    <!-- หน้าต่าง Modal อ่านข่าวเต็มจอ (ซ่อนไว้ก่อนจนกว่าจะกด) -->
    <div id="news-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-modal w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-3xl p-6 md:p-8 shadow-2xl relative border border-cyan-500/30">
            <!-- ปุ่มปิด Modal -->
            <button onclick="closeModal()" class="absolute top-4 right-4 glass-btn px-3 py-1.5 rounded-full text-sm font-bold text-gray-300 hover:text-white">
                ✕ ปิด
            </button>

            <!-- เนื้อหาข่าวเต็มจอ -->
            <div class="flex items-center gap-3 mb-4">
                <span id="modal-cat" class="px-3 py-1 text-xs font-semibold bg-cyan-500/20 text-cyan-300 rounded-full border border-cyan-500/30"></span>
                <span id="modal-date" class="text-xs text-gray-400"></span>
            </div>
            
            <h2 id="modal-title" class="text-2xl md:text-3xl font-extrabold mb-4 text-white leading-tight"></h2>
            
            <img id="modal-img" src="" alt="News Image" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80';" class="w-full h-72 md:h-96 object-cover rounded-2xl mb-6 border border-white/10 shadow-lg">
            
            <p id="modal-desc" class="text-gray-200 text-base md:text-lg leading-relaxed mb-6"></p>

            <!-- ปุ่มฟังเสียงในหน้าเต็มจอ -->
            <div class="flex justify-end gap-3 pt-4 border-t border-white/10">
                <button id="modal-speak-btn" class="glass-btn px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 text-cyan-300 border-cyan-500/40">
                    🔊 ฟังเสียงข่าวนี้
                </button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'th,en,sv,de,fr,it,es,da,no',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function triggerTranslate(lang) {
            var selectField = document.querySelector(".goog-te-combo");
            if (selectField) {
                selectField.value = lang;
                selectField.dispatchEvent(new Event("change"));
            } else {
                alert("ระบบแปลกำลังโหลด กรุณารอสักครู่แล้วลองใหม่อีกครั้งครับ");
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .goog-logo-link { display: none !important; }
        .goog-te-gadget { color: transparent !important; }
    </style>

    <script>
        let allNewsData = [];
        let currentCountry = 'all';

        async function loadNews() {
            try {
                const response = await fetch('news.json');
                allNewsData = await response.json();
                renderNews();
            } catch (error) {
                console.error("โหลดข่าวไม่สำเร็จ:", error);
            }
        }

        // ฟังก์ชันสั่งอ่านเสียง
        function speakText(title, desc) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(`${title}. ${desc}`);
                const isThai = document.documentElement.lang === 'th' || document.body.innerText.includes('ข่าว');
                utterance.lang = isThai ? 'th-TH' : 'en-US';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับระบบอ่านออกเสียงครับ");
            }
        }

        // เปิด Modal อ่านข่าวเต็มจอ
        function openModal(title, desc, cat, date, img) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-cat').innerText = cat || 'General';
            document.getElementById('modal-date').innerText = date;
            document.getElementById('modal-img').src = img || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80';
            
            // ผูกฟังก์ชันปุ่มฟังเสียงใน Modal
            const speakBtn = document.getElementById('modal-speak-btn');
            speakBtn.onclick = () => speakText(title, desc);

            document.getElementById('news-modal').classList.remove('hidden');
        }

        // ปิด Modal
        function closeModal() {
            document.getElementById('news-modal').classList.add('hidden');
            window.speechSynthesis.cancel(); // หยุดเสียงอ่านเวลาปิดหน้าต่าง
        }

        function renderNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            const filtered = currentCountry === 'all' 
                ? allNewsData 
                : allNewsData.filter(item => item.cat && item.cat.toLowerCase() === currentCountry.toLowerCase());

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-300 py-10 glass-card rounded-2xl">No news found for this country.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card p-6 rounded-2xl shadow-xl transition-all duration-300 hover:border-cyan-500/50 cursor-pointer group';
                
                // Escape string ป้องกัน Error
                const safeTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeDesc = item.desc.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeCat = item.cat || 'General';
                const safeDate = item.date;
                const safeImg = item.img || '';

                // คลิกที่การ์ดเพื่อเปิดอ่านเต็มจอ
                card.onclick = () => openModal(item.title, item.desc, safeCat, safeDate, safeImg);

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="px-3 py-1 text-xs font-semibold bg-cyan-500/20 text-cyan-300 rounded-full border border-cyan-500/30">${safeCat}</span>
                        <span class="text-xs text-gray-400">${safeDate}</span>
                    </div>
                    <h2 class="text-xl font-bold mb-2 text-white group-hover:text-cyan-300 transition-colors">${item.title}</h2>
                    <p class="text-gray-300 text-sm leading-relaxed mb-4 line-clamp-2">${item.desc}</p>
                    ${safeImg ? `<img src="${safeImg}" alt="News Image" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80';" class="w-full h-48 object-cover rounded-xl mt-2 border border-white/10">` : ''}
                    <div class="mt-4 text-xs text-cyan-400 font-semibold flex items-center gap-1">
                        👉 คลิกเพื่ออ่านข่าวเต็มจอ / ฟังเสียง
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCountry(country) {
            currentCountry = country;
            document.querySelectorAll('#country-filters button').forEach(btn => {
                if (btn.getAttribute('data-country') === country) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderNews();
        }

        loadNews();
    </script>
</body>
</html>
