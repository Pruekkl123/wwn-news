    <title>W.W.N // Worldwide News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .holo-card {
            background: rgba(13, 20, 38, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }
        .holo-card:hover {
            border-color: rgba(0, 240, 255, 0.7);
            transform: translateY(-3px);
        }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

    <!-- HEADER -->

        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-400 text-slate-950 font-black px-3 py-1.5 rounded font-mono text-lg">W.W.N</div>
                <span class="font-mono font-bold tracking-widest text-white">WORLDWIDE NEWS</span>
            </div>
            <div class="flex gap-2 font-mono text-xs">
                <button onclick="filterNews('all')" class="cat-btn px-3 py-1.5 rounded bg-cyan-400 text-slate-950 font-bold">ALL</button>
                <button onclick="filterNews('Sweden')" class="cat-btn px-3 py-1.5 rounded bg-slate-900 text-slate-300 border border-cyan-500/30">SWEDEN</button>
                <button onclick="filterNews('Denmark')" class="cat-btn px-3 py-1.5 rounded bg-slate-900 text-slate-300 border border-cyan-500/30">DENMARK</button>
                <button onclick="filterNews('Germany')" class="cat-btn px-3 py-1.5 rounded bg-slate-900 text-slate-300 border border-cyan-500/30">GERMANY</button>
                <button onclick="filterNews('Europe')" class="cat-btn px-3 py-1.5 rounded bg-slate-900 text-slate-300 border border-cyan-500/30">EUROPE</button>
            </div>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <h2 id="heading" class="font-mono text-cyan-400 font-bold mb-6">WORLDWIDE NEWS // ALL REPORTS (40)</h2>

    </main>

            40: { title: "European maritime authorities strengthen Baltic protections", cat: "Europe", date: "Oct 14, 2026", img: "https://picsum.photos/id/400/800/600", desc: "Joint maritime patrols enforce rigorous emission standards and ecological safeguards." }
        };

        function renderNews(filter = 'all') {
            const grid = document.getElementById('grid');
            const heading = document.getElementById('heading');
            grid.innerHTML = '';
            
            let count = 0;
            newsData.forEach(item => {
                if (filter === 'all' || item.cat.toLowerCase() === filter.toLowerCase()) {
                    count++;
                    const card = document.createElement('div');
                    card.className = "holo-card rounded-xl p-4 flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="relative h-44 rounded-lg overflow-hidden bg-slate-900 mb-3">
                                <img src="${item.img}" class="w-full h-full object-cover">
                                <span class="absolute top-2 left-2 bg-slate-950/80 text-cyan-400 font-mono text-[10px] px-2 py-0.5 rounded border border-cyan-500/30">${item.cat}</span>
                            </div>
                            <div class="font-mono text-xs text-slate-400 mb-1">${item.date} • 3m read</div>
                            <h3 class="font-bold text-sm text-white line-clamp-2 mb-2">${item.title}</h3>
                            <p class="text-xs text-slate-400 line-clamp-3">${item.desc}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-cyan-500/20 flex justify-between items-center font-mono text-xs">
                            <span class="text-slate-500">W.W.N</span>
                            <span class="text-cyan-400 font-bold">DISPATCH</span>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
            heading.innerText = `WORLDWIDE NEWS // ${filter.toUpperCase()} REPORTS (${count})`;
        }

        function filterNews(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-3 py-1.5 rounded bg-slate-900 text-slate-300 border border-cyan-500/30";
            });
            event.target.className = "cat-btn px-3 py-1.5 rounded bg-cyan-400 text-slate-950 font-bold";
            renderNews(cat);
        }

        window.onload = function() {
            renderNews('all');
        };
    </script>
</body>
</html>
