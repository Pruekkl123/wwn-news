<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N // Worldwide News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #020617;
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: #f8fafc;
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto;
            will-change: transform;
        }

        .liquid-glass-card {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .liquid-glass-card:hover {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(0, 240, 255, 0.7);
            border-top-color: rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.8), 
                0 0 35px rgba(0, 240, 255, 0.3), 
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        .glass-tag {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .liquid-header {
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
        }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <canvas id="starfield"></canvas>

    <!-- HEADER / NAVIGATION -->
    <header class="liquid-header sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-400 text-slate-950 font-black px-3.5 py-1.5 rounded-2xl font-mono text-lg shadow-[0_0_25px_rgba(0,240,255,0.8)] border border-white/40">W.W.N</div>
                <span class="font-mono font-bold tracking-widest text-slate-100 text-sm drop-shadow">WORLDWIDE NEWS</span>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 font-mono text-xs">
                <button onclick="filterNews('all')" class="cat-btn px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 font-bold shadow-[0_0_20px_rgba(0,240,255,0.6)] transition cursor-pointer">ALL</button>
                <button onclick="filterNews('Sweden')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-card text-slate-300 hover:text-white transition cursor-pointer">SWEDEN</button>
                <button onclick="filterNews('Denmark')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-card text-slate-300 hover:text-white transition cursor-pointer">DENMARK</button>
                <button onclick="filterNews('Germany')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-card text-slate-300 hover:text-white transition cursor-pointer">GERMANY</button>
                <button onclick="filterNews('Europe')" class="cat-btn px-4 py-2 rounded-xl liquid-glass-card text-slate-300 hover:text-white transition cursor-pointer">EUROPE</button>
                
                <!-- TRANSLATE BUTTON -->
                <button onclick="toggleTranslate()" id="translate-btn" class="liquid-glass-card px-4 py-2 rounded-xl text-cyan-300 hover:text-white font-bold flex items-center gap-2 border border-cyan-400/50 cursor-pointer shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                    <i class="fas fa-language text-cyan-400"></i>
                    <span id="translate-text">TH / EN</span>
                </button>

                <!-- REAL-TIME CLOCK -->
                <div class="liquid-glass-card px-3.5 py-2 rounded-xl text-cyan-400 font-bold flex items-center gap-2 border border-cyan-400/40">
                    <i class="far fa-clock text-cyan-400 animate-pulse"></i>
                    <span id="live-clock">00:00:00 UTC</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ARCHIVE BAR -->
    <div class="liquid-glass-card border-x-0 border-t-0 rounded-none py-2.5 px-6 relative z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between font-mono text-xs">
            <span class="text-cyan-400 font-semibold flex items-center"><i class="fas fa-satellite-dish mr-2 text-cyan-400 animate-pulse"></i> <span id="dispatch-label">LIVE NEWS DISPATCHES:</span></span>
            <span class="px-3 py-1 rounded-lg bg-cyan-500/10 text-cyan-300 border border-cyan-400/30" id="live-date">OCT 31, 2026</span>
        </div>
    </div>

    <!-- MAIN CONTENT GRID -->
    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full relative z-10 pointer-events-none">
        <h2 id="heading" class="font-mono text-cyan-400 font-bold text-sm tracking-wider mb-6 drop-shadow pointer-events-auto">WORLDWIDE NEWS // ALL REPORTS</h2>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pointer-events-auto"></div>
    </main>

    <!-- ARTICLE READING MODAL -->
    <div id="article-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/85 backdrop-blur-2xl flex justify-center items-center p-4">
        <div class="relative liquid-glass-card w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="sticky top-0 z-10 liquid-header p-5 flex items-center justify-between font-mono text-xs border-b border-cyan-500/30">
                <span id="modal-category" class="text-cyan-400 font-bold uppercase tracking-widest">CATEGORY</span>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-900 hover:bg-cyan-500 hover:text-slate-950 text-slate-300 flex items-center justify-center transition cursor-pointer"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 sm:p-8 overflow-y-auto space-y-5">
                <h1 id="modal-title" class="text-xl sm:text-2xl font-black text-white leading-snug"></h1>
                <div class="font-mono text-xs text-slate-400" id="modal-date"></div>
                <div class="rounded-2xl overflow-hidden h-72 bg-slate-950 border border-cyan-500/30 shadow-inner flex items-center justify-center">
                    <img id="modal-image" src="" alt="News Image" class="w-full h-full object-cover">
                </div>
                <div id="modal-body" class="text-slate-300 text-sm leading-relaxed space-y-4"></div>
            </div>
        </div>
    </div>

        function updateClock() {
            var now = new Date();
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            
            var clockElem = document.getElementById('live-clock');
            if (clockElem) {
                clockElem.innerText = hours + ':' + minutes + ':' + seconds;
            }

            var options = { month: 'short', day: 'numeric', year: 'numeric' };
            var dateStr = now.toLocaleDateString('en-US', options).toUpperCase();
            var dateElem = document.getElementById('live-date');
            if (dateElem) {
                dateElem.innerText = dateStr;
            }
        }
        setInterval(updateClock, 1000);

                btnText.innerText = "EN / TH";

            }

            newsData = originalNewsData.map(function(item) {
                return {
                    cat: item.cat,
                    date: item.date,
                    title: isThai ? translateToThai(item.originalTitle) : item.originalTitle,
                    desc: isThai ? translateToThai(item.originalDesc) : item.originalDesc,
                    img: item.img,
                    originalTitle: item.originalTitle,
                    originalDesc: item.originalDesc
                };
            });

            renderNews(currentFilter);

        function initBackground() {
            var canvas = document.getElementById('starfield');
            if (!canvas) return;
            var ctx = canvas.getContext('2d', { alpha: false });
            var width = canvas.width = window.innerWidth;
            var height = canvas.height = window.innerHeight;
            
            var mouse = { x: -1000, y: -1000 };
            var entities = [];
            var colors = ['#00FFFF', '#00F0FF', '#FF007F', '#00FF66', '#BF00FF', '#FFD700'];

            for (var i = 0; i < 70; i++) {
                entities.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    scale: 1,
                    targetScale: 1,
                    type: Math.floor(Math.random() * 4),
                    color: colors[Math.floor(Math.random() * colors.length)],
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.04
                });
            }

            window.addEventListener('mousemove', function(evt) {
                mouse.x = evt.clientX;
                mouse.y = evt.clientY;
            }, { passive: true });

            window.addEventListener('touchmove', function(evt) {
                if (evt.touches.length > 0) {
                    mouse.x = evt.touches[0].clientX;
                    mouse.y = evt.touches[0].clientY;
                }
            }, { passive: true });

            function drawShapePath(ctx, type) {
                if (type === 0) {
                    ctx.beginPath();
                    ctx.moveTo(-10, 5); ctx.lineTo(10, 5);
                    ctx.moveTo(-8, 5); ctx.lineTo(-8, 12);
                    ctx.moveTo(8, 5); ctx.lineTo(8, 12);
                    ctx.moveTo(10, 5); ctx.lineTo(15, -4);
                    ctx.stroke();
                } else if (type === 1) {
                    ctx.beginPath();
                    ctx.arc(0, 5, 7, 0, Math.PI * 2);
                    ctx.moveTo(-5, -2); ctx.lineTo(-9, -9);
                    ctx.moveTo(5, -2); ctx.lineTo(9, -9);
                    ctx.stroke();
                } else if (type === 2) {
                    ctx.beginPath();
                    ctx.rect(-7, -7, 14, 14);
                    ctx.moveTo(-14, 0); ctx.lineTo(-7, 0);
                    ctx.moveTo(7, 0); ctx.lineTo(14, 0);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function animate() {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, width, height);

                for (var i = 0; i < entities.length; i++) {
                    var e = entities[i];
                    e.x += e.vx; e.y += e.vy;
                    e.angle += e.spin;

                    var dx = mouse.x - e.x;
                    var dy = mouse.y - e.y;
                    var distSq = dx * dx + dy * dy;

                    if (distSq < 10000) {
                        e.targetScale = 2.6;
                    } else {
                        e.targetScale = 1;
                    }

                    e.scale += (e.targetScale - e.scale) * 0.2;

                    if (e.x < -60) e.x = width + 60; if (e.x > width + 60) e.x = -60;
                    if (e.y < -60) e.y = height + 60; if (e.y > height + 60) e.y = -60;

                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.scale(e.scale, e.scale);
                    ctx.rotate(e.angle);

                    ctx.strokeStyle = e.color;
                    ctx.fillStyle = e.color;
                    
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = e.scale > 1.5 ? 25 : 12;
                    ctx.shadowColor = e.color;
                    ctx.globalAlpha = 0.7;
                    drawShapePath(ctx, e.type);

                    ctx.lineWidth = 1.8;
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 0.95;
                    drawShapePath(ctx, e.type);

                    ctx.restore();
                }
                requestAnimationFrame(animate);
            }

            window.onresize = function() { 
                width = canvas.width = window.innerWidth; 
                height = canvas.height = window.innerHeight; 
            };
            animate();
        }

        function loadNews() {
            fetch('news.json')
                .then(response => response.json())
                .then(data => {
                    originalNewsData = data.map(function(item, index) {
                        // บังคับหยิบรูปจากคลังตาม Index เรียงยาวไปเลย รับประกันว่าทุกการ์ดได้รูปไม่ซ้ำกันแน่นอน 100%
                        var uniqueAssignedImg = masterImagePool[index % masterImagePool.length];
                        return {
                            cat: item.cat,
                            date: item.date,
                            originalTitle: item.title,
                            originalDesc: item.desc,
                            img: uniqueAssignedImg
                        };
                    });
                    newsData = JSON.parse(JSON.stringify(originalNewsData));
                    renderNews(currentFilter);
                })
                .catch(err => {
                    console.log('Error loading news.json:', err);
                });
        }

        function renderNews(filter) {
            currentFilter = filter || 'all';
            var grid = document.getElementById('grid');
            var heading = document.getElementById('heading');
            if (!grid || !heading) return;
            grid.innerHTML = '';
            
            var count = 0;
            for (var i = 0; i < newsData.length; i++) {
                var item = newsData[i];
                if (currentFilter === 'all' || item.cat.toLowerCase() === currentFilter.toLowerCase()) {
                    count++;
                    var card = document.createElement('div');
                    card.className = "liquid-glass-card rounded-3xl p-5 flex flex-col justify-between cursor-pointer group";
                    card.onclick = (function(newsItem) { return function() { openModal(newsItem); }; })(item);

                    card.innerHTML = 
                        '<div>' +
                            '<div class="relative h-48 rounded-2xl overflow-hidden bg-slate-950 mb-4 border border-cyan-500/20 shadow-inner flex items-center justify-center">' +
                                '<img src="' + item.img + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 ease-out">' +
                                '<span class="absolute top-3 left-3 glass-tag text-cyan-400 font-mono text-[10px] px-3 py-1 rounded-xl font-bold shadow-lg">' + item.cat + '</span>' +
                            '</div>' +
                            '<div class="font-mono text-xs text-slate-400 mb-2">' + item.date + ' • 3m read</div>' +
                            '<h3 class="font-bold text-sm text-white line-clamp-2 mb-2.5 group-hover:text-cyan-400 transition">' + (item.title || item.originalTitle) + '</h3>' +
                            '<p class="text-xs text-slate-300 line-clamp-3 leading-relaxed">' + (item.desc || item.originalDesc) + '</p>' +
                        '</div>' +
                        '<div class="mt-5 pt-3.5 border-t border-cyan-500/20 flex justify-between items-center font-mono text-xs">' +
                            '<span class="text-slate-400 font-medium">W.W.N</span>' +
                            '<span class="text-cyan-400 font-bold flex items-center gap-1 group-hover:translate-x-1 transition">READ <i class="fas fa-chevron-right text-[9px]"></i></span>' +
                        '</div>';
                    grid.appendChild(card);
                }
            }
            var reportText = isThai ? 'รายงานข่าว' : 'REPORTS';
            heading.innerText = 'WORLDWIDE NEWS // ' + currentFilter.toUpperCase() + ' ' + reportText + ' (' + count + ')';
        }

        function openModal(item) {
            document.getElementById('modal-category').innerText = item.cat;
            document.getElementById('modal-title').innerText = item.title || item.originalTitle;
            document.getElementById('modal-date').innerText = item.date + ' • 3m read';
            document.getElementById('modal-image').src = item.img;
            document.getElementById('modal-body').innerHTML = '<p>' + (item.desc || item.originalDesc) + '</p>';
            document.getElementById('article-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
        }

        function filterNews(cat) {
            var btns = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].className = "cat-btn px-4 py-2 rounded-xl liquid-glass-card text-slate-300 hover:text-white transition cursor-pointer";
            }
            if (window.event && window.event.target) {
                window.event.target.className = "cat-btn px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 font-bold shadow-[0_0_20px_rgba(0,240,255,0.6)] transition cursor-pointer";
            }
            renderNews(cat);
        }

        window.onload = function() {
            updateClock();
            initBackground();
            loadNews();
        };
    </script>
</body>
</html>
