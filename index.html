<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.W.N // Worldwide News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%);
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            color: #f8fafc;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Apple Liquid Glass Style */
        .liquid-glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .liquid-glass:hover {
            background: rgba(30, 41, 59, 0.75);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
        }

        .liquid-header {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <canvas id="starfield"></canvas>

    <!-- HEADER / NAVIGATION -->
    <header class="liquid-header sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-cyan-500 to-sky-400 text-slate-950 font-black px-3.5 py-1.5 rounded-xl font-mono text-lg shadow-[0_0_25px_rgba(56,189,248,0.5)]">W.W.N</div>
                <span class="font-mono font-bold tracking-widest text-slate-200 text-sm">WORLDWIDE NEWS</span>
            </div>
            
            <div class="flex flex-wrap gap-2 font-mono text-xs">
                <button onclick="filterNews('all')" class="cat-btn px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 font-bold shadow-lg shadow-cyan-500/25 transition cursor-pointer">ALL</button>
                <button onclick="filterNews('Sweden')" class="cat-btn px-4 py-2 rounded-xl bg-slate-900/50 text-slate-300 border border-white/10 hover:bg-slate-800 transition cursor-pointer">SWEDEN</button>
                <button onclick="filterNews('Denmark')" class="cat-btn px-4 py-2 rounded-xl bg-slate-900/50 text-slate-300 border border-white/10 hover:bg-slate-800 transition cursor-pointer">DENMARK</button>
                <button onclick="filterNews('Germany')" class="cat-btn px-4 py-2 rounded-xl bg-slate-900/50 text-slate-300 border border-white/10 hover:bg-slate-800 transition cursor-pointer">GERMANY</button>
                <button onclick="filterNews('Europe')" class="cat-btn px-4 py-2 rounded-xl bg-slate-900/50 text-slate-300 border border-white/10 hover:bg-slate-800 transition cursor-pointer">EUROPE</button>
            </div>
        </div>
    </header>

    <!-- ARCHIVE BAR -->
    <div class="bg-slate-900/40 backdrop-blur-md border-b border-white/5 py-2.5 px-6 relative z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between font-mono text-xs">
            <span class="text-sky-400 font-semibold"><i class="fas fa-satellite-dish mr-1.5"></i> LIVE DISPATCH FEED:</span>
            <div class="flex gap-2">
                <span class="px-3 py-1 rounded-lg bg-sky-500/10 text-sky-300 border border-sky-500/30">TODAY (OCT 17, 2026)</span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT GRID -->
    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full relative z-10">
        <h2 id="heading" class="font-mono text-sky-400 font-bold text-sm tracking-wider mb-6">WORLDWIDE NEWS // ALL REPORTS</h2>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- ARTICLE READING MODAL (LIQUID GLASS) -->
    <div id="article-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/80 backdrop-blur-xl flex justify-center items-center p-4">
        <div class="relative liquid-glass w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="sticky top-0 z-10 bg-slate-950/80 backdrop-blur-md border-b border-white/10 p-5 flex items-center justify-between font-mono text-xs">
                <span id="modal-category" class="text-sky-400 font-bold uppercase tracking-widest">CATEGORY</span>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 flex items-center justify-center transition cursor-pointer"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 sm:p-8 overflow-y-auto space-y-5">
                <h1 id="modal-title" class="text-xl sm:text-2xl font-black text-white leading-snug"></h1>
                <div class="font-mono text-xs text-slate-400" id="modal-date"></div>
                <div class="rounded-2xl overflow-hidden h-72 bg-slate-900 border border-white/10 shadow-inner">
                    <img id="modal-image" src="" alt="News Image" class="w-full h-full object-cover">
                </div>
                <div id="modal-body" class="text-slate-300 text-sm leading-relaxed space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        var newsData = [];
        var currentFilter = 'all';

        function initStarfield() {
            var canvas = document.getElementById('starfield');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var width = canvas.width = window.innerWidth;
            var height = canvas.height = window.innerHeight;
            var stars = [];
            var shootingStars = [];
            var colors = ['#38bdf8', '#ffffff', '#0284c7', '#7dd3fc'];

            for (var i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 0.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15,
                    alpha: Math.random() * 0.7 + 0.3,
                    speed: Math.random() * 0.01 + 0.003,
                    decreasing: Math.random() > 0.5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.x += s.vx; s.y += s.vy;
                    if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
                    if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
                    if (s.decreasing) {
                        s.alpha -= s.speed; if (s.alpha <= 0.2) s.decreasing = false;
                    } else {
                        s.alpha += s.speed; if (s.alpha >= 0.9) s.decreasing = true;
                    }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = s.alpha;
                    ctx.shadowBlur = (s.radius > 1.5) ? 10 : 3;
                    ctx.shadowColor = s.color;
                    ctx.fill();
                }
                if (Math.random() < 0.03 && shootingStars.length < 3) {
                    shootingStars.push({ x: Math.random() * width, y: Math.random() * (height / 2), length: Math.random() * 120 + 80, speed: Math.random() * 10 + 6, alpha: 1 });
                }
                for (var j = shootingStars.length - 1; j >= 0; j--) {
                    var ss = shootingStars[j];
                    var endX = ss.x - ss.length * 0.707;
                    var endY = ss.y + ss.length * 0.707;
                    var grad = ctx.createLinearGradient(ss.x, ss.y, endX, endY);
                    grad.addColorStop(0, 'rgba(56, 189, 248, ' + ss.alpha + ')');
                    grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                    ctx.globalAlpha = 1;
                    ctx.beginPath();
                    ctx.moveTo(ss.x, ss.y); ctx.lineTo(endX, endY);
                    ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.shadowBlur = 12; ctx.shadowColor = '#38bdf8'; ctx.stroke();
                    ss.x += ss.speed * 0.707; ss.y += ss.speed * 0.707; ss.alpha -= 0.02;
                    if (ss.alpha <= 0) shootingStars.splice(j, 1);
                }
                requestAnimationFrame(animate);
            }
            window.onresize = function() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
            animate();
        }

        function loadNews() {
            fetch('news.json')
                .then(response => response.json())
                .then(data => {
                    newsData = data;
                    renderNews(currentFilter);
                })
                .catch(err => {
                    console.log('Error loading news.json:', err);
                });
        }

        function renderNews(filter) {
            currentFilter = filter || 'all';
            var grid = document.getElementById('grid');
            var heading = document.getElementById('heading');
            if (!grid || !heading) return;
            grid.innerHTML = '';
            
            var count = 0;
            for (var i = 0; i < newsData.length; i++) {
                var item = newsData[i];
                if (currentFilter === 'all' || item.cat.toLowerCase() === currentFilter.toLowerCase()) {
                    count++;
                    var card = document.createElement('div');
                    card.className = "liquid-glass rounded-2xl p-5 flex flex-col justify-between cursor-pointer group";
                    card.onclick = (function(newsItem) { return function() { openModal(newsItem); }; })(item);
                    card.innerHTML = 
                        '<div>' +
                            '<div class="relative h-48 rounded-xl overflow-hidden bg-slate-900/50 mb-4 border border-white/5">' +
                                '<img src="' + item.img + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 ease-out">' +
                                '<span class="absolute top-3 left-3 bg-slate-950/70 backdrop-blur-md text-sky-400 font-mono text-[10px] px-2.5 py-1 rounded-lg border border-white/10 shadow-lg">' + item.cat + '</span>' +
                            '</div>' +
                            '<div class="font-mono text-xs text-slate-400 mb-2">' + item.date + ' • 3m read</div>' +
                            '<h3 class="font-bold text-sm text-white line-clamp-2 mb-2.5 group-hover:text-sky-300 transition">' + item.title + '</h3>' +
                            '<p class="text-xs text-slate-400 line-clamp-3 leading-relaxed">' + item.desc + '</p>' +
                        '</div>' +
                        '<div class="mt-5 pt-3.5 border-t border-white/10 flex justify-between items-center font-mono text-xs">' +
                            '<span class="text-slate-500 font-medium">W.W.N</span>' +
                            '<span class="text-sky-400 font-bold flex items-center gap-1 group-hover:translate-x-1 transition">READ <i class="fas fa-chevron-right text-[9px]"></i></span>' +
                        '</div>';
                    grid.appendChild(card);
                }
            }
            heading.innerText = 'WORLDWIDE NEWS // ' + currentFilter.toUpperCase() + ' REPORTS (' + count + ')';
        }

        function openModal(item) {
            document.getElementById('modal-category').innerText = item.cat;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-date').innerText = item.date + ' • 3m read';
            document.getElementById('modal-image').src = item.img;
            document.getElementById('modal-body').innerHTML = '<p>' + item.desc + '</p>';
            document.getElementById('article-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
        }

        function filterNews(cat) {
            var btns = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].className = "cat-btn px-4 py-2 rounded-xl bg-slate-900/50 text-slate-300 border border-white/10 hover:bg-slate-800 transition cursor-pointer";
            }
            if (window.event && window.event.target) {
                window.event.target.className = "cat-btn px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 font-bold shadow-lg shadow-cyan-500/25 transition cursor-pointer";
            }
            renderNews(cat);
        }

        window.onload = function() {
            initStarfield();
            loadNews();
        };
    </script>
</body>
</html>
